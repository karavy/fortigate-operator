---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: fortigatebackups.k8s.dinova.one
spec:
  group: k8s.dinova.one
  names:
    kind: FortigateBackup
    listKind: FortigateBackupList
    plural: fortigatebackups
    singular: fortigatebackup
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: FortigateBackup is the Schema for the fortigatebackups API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of FortigateBackup
            properties:
              at:
                default: "02:00"
                description: |-
                  At: a che ora del giorno eseguirlo, formato "HH:MM" (24 ore).
                  Ignorato se Frequency è "Hourly".
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                type: string
              dayOfMonth:
                description: |-
                  DayOfMonth: usato solo se Frequency è "Monthly". Limitato a 1-31 per
                  evitare l'ambiguità dei mesi più corti (niente "31 di febbraio").
                format: int32
                maximum: 31
                minimum: 1
                type: integer
              dayOfWeek:
                description: 'DayOfWeek: usato solo se Frequency è "Weekly".'
                enum:
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
                - Saturday
                - Sunday
                type: string
              frequency:
                default: Daily
                enum:
                - Hourly
                - Daily
                - Weekly
                - Monthly
                type: string
              maxBackups:
                default: 7
                description: |-
                  MaxBackups: quanti Backup completati con successo tenere (i più
                  vecchi oltre questo numero vengono cancellati dal controller insieme
                  al loro artefatto S3, grazie al finalizer su Backup).
                format: int32
                minimum: 1
                type: integer
              suspend:
                description: |-
                  Suspend mette in pausa la creazione di nuovi Backup senza cancellare
                  la BackupSchedule stessa - stesso pattern di CronJob.spec.suspend.
                type: boolean
              template:
                description: |-
                  Template descrive cosa deve contenere ogni Backup generato da questa
                  schedule - stessi campi di BackupSpec, riusati qui.
                properties:
                  destination:
                    description: |-
                      Destination: dove va salvato l'artefatto. Bucket/region/endpoint
                      possono essere ereditati da OperatorConfig (come già fai per
                      s3Region) se omessi qui - lascia solo il necessario per override.
                    properties:
                      bucketName:
                        type: string
                      prefix:
                        type: string
                    type: object
                  retentionDays:
                    description: |-
                      RetentionDays: dopo quanti giorni dal completamento questo Backup (e
                      il suo artefatto S3, se il finalizer lo gestisce) può essere
                      cancellato automaticamente - alternativa/complemento a MaxBackups
                      sulla Schedule per chi crea Backup singoli senza una Schedule.
                    format: int32
                    minimum: 1
                    type: integer
                  source:
                    description: |-
                      Source referenzia la risorsa da cui fare il backup PER NOME - non
                      duplicare qui bucket/credenziali/altri campi già presenti su quella
                      risorsa, il controller li risolve lui.
                    properties:
                      kind:
                        enum:
                        - FortigateFirewall
                        - FortigateConfig
                        type: string
                      name:
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: source è immutabile dopo la creazione
                      rule: self == oldSelf
                required:
                - source
                type: object
            required:
            - template
            type: object
          status:
            description: status defines the observed state of FortigateBackup
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the FortigateBackup resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastBackupTime:
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration permette al controller/a chi legge di sapere se lo
                  status riflette l'ultima versione dello spec o è ancora "vecchio".
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
