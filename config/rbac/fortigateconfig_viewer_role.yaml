# This rule is not used by the project k8s-operator-fortigate itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to k8s.dinova.one resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-operator-fortigate
    app.kubernetes.io/managed-by: kustomize
  name: fortigateconfig-viewer-role
rules:
- apiGroups:
  - k8s.dinova.one
  resources:
  - fortigateconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - k8s.dinova.one
  resources:
  - fortigateconfigs/status
  verbs:
  - get
