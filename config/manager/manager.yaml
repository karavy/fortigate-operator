apiVersion: apps/v1
kind: Deployment
metadata:
  name: fgt-operator
  labels:
    control-plane: fgt-operator
    app.kubernetes.io/name: k8s-operator-fortigate
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: fgt-operator
      app.kubernetes.io/name: k8s-operator-fortigate
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: fgt-operator
        app.kubernetes.io/name: k8s-operator-fortigate
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        #TODO: runAsNonRoot: true
        #seccompProfile:
          #type: RuntimeDefault
      restartPolicy: Always
      containers:
      - image: cdmdckr/redis-operator:0.0.1
        imagePullPolicy: IfNotPresent
        name: manager
        command: [/manager]
        args: []
        env:
        - name: FGT_OPERATOR_CONFIG_FILE
          value: /etc/fgt-operator-config/operator-config.json
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          #TODO: readOnlyRootFilesystem: true
          #allowPrivilegeEscalation: false
          #capabilities:
            #drop:
            #- "ALL"
        #livenessProbe:
          #httpGet:
            #path: /healthz
            #port: 8081
          #initialDelaySeconds: 15
          #periodSeconds: 20
        #readinessProbe:
          #httpGet:
            #path: /readyz
            #port: 8081
          #initialDelaySeconds: 5
          #periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - mountPath: /ssh
          name: ssh-key
        - mountPath: /terraform
          name: terra
        - mountPath: /tmp
          name: terraform-temp
        - mountPath: /firmwares
          name: fortigate-firmwares
        - name: operator-config
          mountPath: /etc/fgt-operator-config
      volumes:
      - name: fortigate-firmwares
        persistentVolumeClaim:
          claimName: fortigate-firmwares
      - name: operator-config
        configMap:
          name: fgt-operator-config
      - name: terraform-temp
        emptyDir: {}
      - name: terra
        emptyDir: {}
      - name: ssh-key
        secret:
          secretName: ssh-key
          optional: true
      serviceAccountName: fortios-vm-controller
      terminationGracePeriodSeconds: 10