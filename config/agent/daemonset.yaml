apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-operator-agent
  labels:
    app: network-operator-agent
spec:
  selector:
    matchLabels:
      app: network-operator-agent
  template:
    metadata:
      labels:
        app: network-operator-agent
    spec:
      serviceAccountName: network-operator-agent
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: cdmdckr/network-operator:0.0.1
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_ADMIN"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
