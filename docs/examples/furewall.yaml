apiVersion: k8s.dinova.one/v1
kind: FortigateFirewall
metadata:
  labels:
    app.kubernetes.io/name: k8s-operator-fortigate
    app.kubernetes.io/managed-by: kustomize
  name: fortigatefirewall-trial
spec:
  pvcStorageClass: <STORAGE_CLASS>
  version: "2026.03"
  type: "vyos"
  hasCloudInitDisk: false
  cloudInitUserData: |
    #cloud-config
    vyos_config_commands:
      - set system host-name 'vyos-firewall-sample'
      - set service ntp server 1.pool.ntp.org
      - set service ntp server 2.pool.ntp.org
      - delete interfaces ethernet eth1 address 'dhcp'
      - set interfaces ethernet eth1 address '192.168.99.9/24'
  ports:
    - name: "port1"
      index: 0
      networkName: "linux-bridge-net-ipam"
      uplinkInterface: <nome della NIC fisica del nodo>
      vlanID: <ID della VLAN>